[package]
name = "immersion-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlVertexArrayObject",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlFramebuffer",
  "WebGlTexture",
  "WebGlRenderbuffer",
  "MouseEvent",
  "console",
]

[profile.release]
opt-level = "s"
